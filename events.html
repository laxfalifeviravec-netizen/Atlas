<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0C0C0F" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <title>One Culture — Events</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=DM+Sans:ital,wght@0,400;0,500;0,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="community.css" />
  <link rel="stylesheet" href="events.css" />
</head>
<body>

  <header class="app-header">
    <span class="app-logo" style="cursor:default">Events</span>
    <div class="app-header-actions">
      <button class="app-icon-btn" id="newEventBtn" aria-label="Create event" style="display:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
      <button class="app-icon-btn" id="themeToggle" aria-label="Toggle theme">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </header>

  <main class="events-main">
    <div id="eventsLoading" class="evt-center-state"><div class="spinner"></div></div>
    <div id="eventsEmpty" class="evt-center-state" style="display:none">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" width="52" height="52"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <p>No events yet — be the first to organise a meet!</p>
      <button class="btn btn-primary" id="createFirstEventBtn" style="display:none">Create Event</button>
    </div>
    <div id="eventsList"></div>
  </main>

  <!-- Event detail overlay -->
  <div class="modal-overlay" id="eventDetailOverlay">
    <div class="modal evt-detail-modal">
      <div class="modal-header">
        <h3 id="evtDetailTitle">Event</h3>
        <button class="modal-close" id="evtDetailClose">&times;</button>
      </div>
      <div class="modal-body" id="evtDetailBody"></div>
    </div>
  </div>

  <!-- Create event modal -->
  <div class="modal-overlay" id="createEventOverlay">
    <div class="modal">
      <div class="modal-header">
        <h3>Create Event</h3>
        <button class="modal-close" id="createEventClose">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">Title *</label>
          <input type="text" id="evtTitle" maxlength="100" placeholder="Midnight canyon run…" />
          <span class="field-error" id="evtTitleError"></span>
        </div>
        <div class="form-group">
          <label class="form-label">Description</label>
          <textarea id="evtDesc" rows="3" maxlength="500" placeholder="Tell people what to expect…"></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">Date &amp; Time *</label>
          <input type="datetime-local" id="evtDate" />
          <span class="field-error" id="evtDateError"></span>
        </div>
        <div class="form-group">
          <label class="form-label">Location</label>
          <input type="text" id="evtLocation" maxlength="200" placeholder="Meeting point address…" />
        </div>
        <span class="field-error" id="evtError"></span>
        <button class="btn btn-primary btn-full" id="saveEventBtn">Create Event</button>
      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="roads-catalog.html" class="bnav-item" aria-label="Roads">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="20" x2="21" y2="20"/><path d="M9 20L12 4l3 16"/></svg>
      <span>Roads</span>
    </a>
    <a href="community.html" class="bnav-item" aria-label="Feed">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      <span>Feed</span>
    </a>
    <a href="community.html" class="bnav-item bnav-post" aria-label="New post">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </a>
    <a href="chat.html" class="bnav-item" aria-label="Chat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span>Chat</span>
    </a>
    <a href="roads.html" class="bnav-item" aria-label="Map">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>
      <span>Map</span>
    </a>
  </nav>

  <script src="events.js"></script>
  <script>if ("serviceWorker" in navigator) { window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js")); }</script>
  <script src="create-sheet.js"></script>
</body>
</html>
