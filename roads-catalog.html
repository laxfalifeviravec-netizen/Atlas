<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0C0C0F" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <title>One Culture — Roads</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=DM+Sans:ital,wght@0,400;0,500;0,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="community.css" />
  <link rel="stylesheet" href="roads-catalog.css" />
</head>
<body>

  <header class="app-header">
    <span class="app-logo" style="cursor:default">Roads</span>
    <div class="app-header-actions">
      <a href="search.html" class="app-icon-btn" aria-label="Search" style="color:inherit;text-decoration:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </a>
      <button class="app-icon-btn" id="themeToggle" aria-label="Toggle theme">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </header>

  <!-- Filter chips -->
  <div class="rc-filters" id="rcFilters">
    <button class="rc-chip active" data-diff="">All</button>
    <button class="rc-chip" data-diff="Easy">Easy</button>
    <button class="rc-chip" data-diff="Moderate">Moderate</button>
    <button class="rc-chip" data-diff="Hard">Hard</button>
    <button class="rc-chip" data-diff="Extreme">Extreme</button>
  </div>

  <main class="rc-main">
    <div id="rcLoading" class="rc-center-state"><div class="spinner"></div></div>
    <div id="rcEmpty" class="rc-center-state" style="display:none">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" width="52" height="52"><line x1="3" y1="20" x2="21" y2="20"/><path d="M9 20L12 4l3 16"/></svg>
      <p>No roads submitted yet</p>
      <a href="roads.html" class="btn btn-primary" style="text-decoration:none">Submit a Road</a>
    </div>
    <div class="rc-grid" id="rcGrid"></div>
  </main>

  <!-- Road detail sheet -->
  <div class="modal-overlay" id="rdOverlay">
    <div class="modal rd-modal">
      <div class="modal-header">
        <h3 id="rdName"></h3>
        <button class="modal-close" id="rdClose">&times;</button>
      </div>
      <div class="modal-body" id="rdBody"></div>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="roads-catalog.html" class="bnav-item active" aria-label="Roads">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="20" x2="21" y2="20"/><path d="M9 20L12 4l3 16"/></svg>
      <span>Roads</span>
    </a>
    <a href="community.html" class="bnav-item" aria-label="Feed">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      <span>Feed</span>
    </a>
    <a href="community.html" class="bnav-item bnav-post" aria-label="New post">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </a>
    <a href="chat.html" class="bnav-item" aria-label="Chat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span>Community</span>
    </a>
    <a href="roads.html" class="bnav-item" aria-label="Map">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>
      <span>Map</span>
    </a>
  </nav>

  <script src="roads-catalog.js"></script>
  <script>if ("serviceWorker" in navigator) { window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js")); }</script>
  <script src="create-sheet.js"></script>
</body>
</html>
