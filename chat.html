<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0C0C0F" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <title>One Culture — Community</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=DM+Sans:ital,wght@0,400;0,500;0,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="community.css" />
  <link rel="stylesheet" href="chat.css" />
</head>
<body>

  <header class="app-header">
    <span class="app-logo" style="cursor:default" id="headerTitle">Messages</span>
    <div class="app-header-actions">
      <button class="app-icon-btn compose-btn" id="newChatBtn" aria-label="Compose">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
      </button>
      <button class="app-icon-btn" id="themeToggle" aria-label="Toggle theme">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </header>

  <!-- Tabs -->
  <div class="chat-tabs" id="chatTabs">
    <button class="chat-tab active" data-tab="messages">Messages</button>
    <button class="chat-tab" data-tab="groups">Groups</button>
  </div>

  <main class="chat-main">

    <!-- Messages tab -->
    <div id="tabMessages" class="chat-tab-panel">
      <div id="msgsLoading" class="chat-center-state"><div class="spinner"></div></div>
      <div id="msgsEmpty" class="chat-center-state" style="display:none">
        <div class="empty-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" width="40" height="40"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        </div>
        <p class="empty-title">No messages yet</p>
        <p class="empty-sub">Start a conversation with another driver</p>
        <button class="btn btn-primary" id="msgsEmptyNewBtn">New Message</button>
      </div>
      <div id="msgsList" class="chat-list" style="display:none"></div>
    </div>

    <!-- Groups tab -->
    <div id="tabGroups" class="chat-tab-panel" style="display:none">
      <div id="grpsLoading" class="chat-center-state"><div class="spinner"></div></div>
      <div id="grpsEmpty" class="chat-center-state" style="display:none">
        <div class="empty-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" width="40" height="40"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        </div>
        <p class="empty-title">No groups yet</p>
        <p class="empty-sub">Create a group to organize drives with friends</p>
        <button class="btn btn-primary" id="grpsEmptyNewBtn">Create Group</button>
      </div>
      <div id="grpsList" class="chat-list" style="display:none"></div>
    </div>

  </main>

  <!-- Conversation view -->
  <div class="conv-view" id="convView">
    <div class="conv-header">
      <button class="app-icon-btn" id="convBack" aria-label="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" width="22" height="22"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="conv-header-avatar" id="convHeaderAvatar"></div>
      <div class="conv-header-info">
        <div class="conv-header-name" id="convHeaderName"></div>
      </div>
    </div>
    <div class="conv-messages" id="convMessages"></div>
    <div class="conv-input-row">
      <input class="conv-input" id="convInput" type="text" placeholder="Message…" autocomplete="off" />
      <button class="conv-send-btn" id="convSendBtn" aria-label="Send">
        <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><line x1="22" y1="2" x2="11" y2="13" stroke="currentColor" stroke-width="2" fill="none"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </div>

  <!-- ═══ NEW MESSAGE SHEET ════════════════════════════════════ -->
  <div class="sheet-overlay" id="newMsgOverlay">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-head">
        <h3 class="sheet-title">New Message</h3>
        <button class="sheet-close-btn" id="newMsgClose">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="16" height="16"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="sheet-search-row">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input class="sheet-search-input" id="newMsgSearch" type="text" placeholder="Search by name…" autocomplete="off" />
      </div>
      <div id="newMsgResults" class="sheet-results"></div>
    </div>
  </div>

  <!-- ═══ CREATE GROUP SHEET ═══════════════════════════════════ -->
  <div class="sheet-overlay" id="newGrpOverlay">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-head">
        <h3 class="sheet-title">New Group</h3>
        <button class="sheet-close-btn" id="newGrpClose">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="16" height="16"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <!-- Group name with icon -->
      <div class="grp-name-row">
        <div class="grp-icon-circle" id="grpIconPreview">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        </div>
        <input class="grp-name-input" id="newGrpName" type="text" placeholder="Group name…" autocomplete="off" maxlength="60" />
      </div>

      <!-- Member search -->
      <div class="sheet-section-label">Add People <span class="sheet-section-hint">optional</span></div>
      <div class="sheet-search-row">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input class="sheet-search-input" id="newGrpSearch" type="text" placeholder="Search people…" autocomplete="off" />
      </div>
      <div id="newGrpResults" class="sheet-results"></div>
      <div id="newGrpSelected" class="grp-chips-row"></div>

      <span class="field-error" id="newGrpError"></span>
      <button class="btn btn-primary btn-full sheet-submit" id="newGrpCreate">Create Group</button>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="community.html" class="bnav-item" aria-label="Feed">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      <span>Feed</span>
    </a>
    <a href="community.html" class="bnav-item bnav-post" aria-label="New post">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </a>
    <a href="chat.html" class="bnav-item active" aria-label="Chat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span>Community</span>
    </a>
    <a href="roads.html" class="bnav-item" aria-label="Map">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>
      <span>Map</span>
    </a>
  </nav>

  <script src="chat.js"></script>
  <script>if ("serviceWorker" in navigator) { window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js")); }</script>
  <script src="create-sheet.js"></script>
</body>
</html>
