<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Atlas — Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=DM+Sans:ital,wght@0,400;0,500;0,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="community.css" />
  <link rel="stylesheet" href="profile.css" />
</head>
<body>

  <!-- Header -->
  <header class="app-header" id="appHeader">
    <button class="app-icon-btn" id="backBtn" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <span class="profile-header-name" id="headerName"></span>
    <div class="app-header-actions">
      <button class="app-icon-btn" id="themeToggle" aria-label="Toggle theme">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </header>

  <!-- Profile block -->
  <main class="profile-main">
    <div class="profile-loading" id="profileLoading"><div class="spinner"></div></div>

    <div class="profile-content" id="profileContent" style="display:none">

      <!-- Top identity -->
      <div class="profile-identity">
        <div class="profile-avatar-wrap" id="profileAvatarWrap">
          <div class="profile-avatar" id="profileAvatar"></div>
        </div>
        <div class="profile-identity-info">
          <div class="profile-name" id="profileName"></div>
          <div class="profile-plan" id="profilePlan"></div>
          <div class="profile-bio" id="profileBio"></div>
        </div>
      </div>

      <!-- Stats row -->
      <div class="profile-stats">
        <button class="profile-stat" id="statPosts">
          <span class="profile-stat-num" id="statPostCount">0</span>
          <span class="profile-stat-label">Posts</span>
        </button>
        <button class="profile-stat" id="statFollowers">
          <span class="profile-stat-num" id="statFollowerCount">0</span>
          <span class="profile-stat-label">Followers</span>
        </button>
        <button class="profile-stat" id="statFollowing">
          <span class="profile-stat-num" id="statFollowingCount">0</span>
          <span class="profile-stat-label">Following</span>
        </button>
      </div>

      <!-- Action buttons -->
      <div class="profile-actions" id="profileActions">
        <!-- Populated by JS: Edit Profile or Follow/Message -->
      </div>

      <!-- Post grid -->
      <div class="profile-grid" id="profileGrid"></div>
      <div class="profile-empty" id="profileEmpty" style="display:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" width="44" height="44"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        <p>No posts yet</p>
      </div>
    </div>
  </main>

  <!-- Bottom Nav -->
  <nav class="bottom-nav">
    <a href="community.html" class="bnav-item" aria-label="Feed">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      <span>Feed</span>
    </a>
    <a href="groups.html" class="bnav-item" aria-label="Groups">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span>Groups</span>
    </a>
    <a href="community.html" class="bnav-item bnav-post" aria-label="New post">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </a>
    <a href="marketplace.html" class="bnav-item" aria-label="Marketplace">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
      <span>Market</span>
    </a>
    <a href="roads.html" class="bnav-item" aria-label="Roads Map">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>
      <span>Roads</span>
    </a>
  </nav>

  <!-- Edit profile modal -->
  <div class="modal-overlay" id="editOverlay">
    <div class="modal">
      <div class="modal-header">
        <h3>Edit Profile</h3>
        <button class="modal-close" id="editClose">&times;</button>
      </div>
      <div class="modal-body">
        <div class="edit-avatar-zone" id="editAvatarZone">
          <input type="file" id="editAvatarInput" accept="image/*" style="display:none" />
          <div class="edit-avatar-preview" id="editAvatarPreview"></div>
          <span>Change photo</span>
        </div>
        <div class="form-group">
          <label style="font-size:12px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;color:var(--c-text-2)">Name</label>
          <input type="text" id="editName" maxlength="60" />
        </div>
        <div class="form-group">
          <label style="font-size:12px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;color:var(--c-text-2)">Bio</label>
          <textarea id="editBio" maxlength="150" rows="3" placeholder="Tell the community about yourself…"></textarea>
        </div>
        <span class="field-error" id="editError"></span>
        <button class="btn btn-primary btn-full" id="saveProfileBtn">Save Changes</button>
      </div>
    </div>
  </div>

  <!-- Auth modal (for non-logged-in follow attempts) -->
  <div class="modal-overlay" id="authOverlay">
    <div class="modal">
      <div class="modal-header">
        <h3 id="authTitle">Sign In</h3>
        <button class="modal-close" id="authClose">&times;</button>
      </div>
      <div class="modal-body">
        <form id="loginForm">
          <div class="form-group">
            <input type="email" id="loginEmail" placeholder="Email" autocomplete="email" />
            <span class="field-error" id="loginEmailError"></span>
          </div>
          <div class="form-group">
            <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password" />
            <span class="field-error" id="loginPasswordError"></span>
          </div>
          <span class="field-error" id="loginError"></span>
          <button type="submit" class="btn btn-primary btn-full">Sign In</button>
        </form>
        <form id="registerForm" style="display:none">
          <div class="form-group"><input type="text" id="regName" placeholder="Full name" /><span class="field-error" id="regNameError"></span></div>
          <div class="form-group"><input type="email" id="regEmail" placeholder="Email" /><span class="field-error" id="regEmailError"></span></div>
          <div class="form-group"><input type="password" id="regPassword" placeholder="Password (6+ chars)" /><span class="field-error" id="regPasswordError"></span></div>
          <span class="field-error" id="regError"></span>
          <button type="submit" class="btn btn-primary btn-full">Create Account</button>
        </form>
        <div class="auth-switch">
          <span id="authSwitchText">Don't have an account?</span>
          <button class="auth-switch-btn" id="authSwitchBtn">Sign Up</button>
        </div>
      </div>
    </div>
  </div>

  <script src="profile.js"></script>
</body>
</html>
