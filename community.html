<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Atlas — Community</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="community.css" />
</head>
<body>

  <!-- Top App Bar -->
  <header class="app-header" id="appHeader">
    <a href="index.html" class="app-logo">Atlas</a>
    <div class="app-header-actions">
      <button class="app-icon-btn" id="themeToggle" aria-label="Toggle theme">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <button class="app-icon-btn" id="newStoryBtn" aria-label="Add story">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
      <div id="navAuth" class="nav-auth"></div>
    </div>
  </header>

  <!-- Stories Row -->
  <div class="stories-row" id="storiesRow">
    <div class="stories-scroll" id="storiesScroll">
      <!-- Add story button -->
      <button class="story-item story-add" id="addStoryBtn">
        <div class="story-avatar-wrap story-avatar-add">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="22" height="22"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </div>
        <span>Your Story</span>
      </button>
      <!-- Stories populated by JS -->
    </div>
  </div>

  <!-- Feed -->
  <main class="feed-main" id="feedMain">
    <div class="feed-loading" id="feedLoading"><div class="spinner"></div></div>
    <div class="feed-list" id="feedList"></div>
    <div class="feed-empty" id="feedEmpty" style="display:none">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="56" height="56"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
      <p>No posts yet. Be the first to share a road.</p>
      <button class="btn btn-primary" id="emptyPostBtn">Share a Road</button>
    </div>
    <div class="feed-load-more" id="feedLoadMore" style="display:none">
      <button class="btn btn-outline" id="loadMoreBtn">Load more</button>
    </div>
  </main>

  <!-- Bottom Nav -->
  <nav class="bottom-nav">
    <a href="community.html" class="bnav-item active" aria-label="Feed">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      <span>Feed</span>
    </a>
    <a href="groups.html" class="bnav-item" aria-label="Groups">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span>Groups</span>
    </a>
    <button class="bnav-item bnav-post" id="newPostBtnNav" aria-label="New post">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
    <a href="marketplace.html" class="bnav-item" aria-label="Marketplace">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
      <span>Market</span>
    </a>
    <a href="roads.html" class="bnav-item" aria-label="Roads Map">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>
      <span>Roads</span>
    </a>
  </nav>

  <!-- ═══ POST DETAIL MODAL ══════════════════════════════════════ -->
  <div class="modal-overlay" id="postOverlay" role="dialog" aria-modal="true">
    <div class="post-modal">
      <button class="modal-close" id="postModalClose">&times;</button>
      <div class="post-modal-image-wrap">
        <img id="postModalImg" src="" alt="" />
      </div>
      <div class="post-modal-sidebar">
        <div class="post-modal-author" id="postModalAuthor"></div>
        <div class="post-modal-road" id="postModalRoad"></div>
        <p class="post-modal-caption" id="postModalCaption"></p>
        <div class="post-modal-comments" id="postModalComments"></div>
        <div class="post-modal-actions" id="postModalActions"></div>
        <form class="post-modal-comment-form" id="postCommentForm">
          <input type="text" id="postCommentInput" placeholder="Add a comment…" autocomplete="off" />
          <button type="submit" class="btn btn-primary btn-sm">Post</button>
        </form>
      </div>
    </div>
  </div>

  <!-- ═══ NEW POST MODAL ══════════════════════════════════════════ -->
  <div class="modal-overlay" id="newPostOverlay" role="dialog" aria-modal="true">
    <div class="modal">
      <div class="modal-header">
        <h3>Share a Road</h3>
        <button class="modal-close" id="newPostClose">&times;</button>
      </div>
      <div class="modal-body">
        <div class="upload-zone" id="uploadZone">
          <input type="file" id="postImageInput" accept="image/*" style="display:none" />
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="40" height="40"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          <p>Click or drag to upload a photo</p>
          <span>JPEG, PNG, WebP up to 8 MB</span>
        </div>
        <img id="uploadPreview" src="" alt="" style="display:none" class="upload-preview" />
        <div class="form-group">
          <input type="text" id="postRoadName" placeholder="Road name (e.g. Tail of the Dragon)" maxlength="100" />
        </div>
        <div class="form-group">
          <select id="postRegion">
            <option value="">Select region…</option>
            <option>West Coast</option><option>Mountain West</option>
            <option>Southwest</option><option>Midwest</option>
            <option>Southeast</option><option>Northeast</option>
          </select>
        </div>
        <div class="form-group">
          <textarea id="postCaption" placeholder="Tell the story of this road…" rows="3" maxlength="500"></textarea>
        </div>
        <span class="field-error" id="newPostError"></span>
        <button class="btn btn-primary btn-full" id="submitPostBtn">Share Road</button>
      </div>
    </div>
  </div>

  <!-- ═══ NEW STORY MODAL ═════════════════════════════════════════ -->
  <div class="modal-overlay" id="newStoryOverlay" role="dialog" aria-modal="true">
    <div class="modal">
      <div class="modal-header">
        <h3>Add to Your Story</h3>
        <button class="modal-close" id="newStoryClose">&times;</button>
      </div>
      <div class="modal-body">
        <div class="upload-zone" id="storyUploadZone">
          <input type="file" id="storyImageInput" accept="image/*" style="display:none" />
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="40" height="40"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          <p>Click to upload your road photo</p>
          <span>Stories expire in 24 hours</span>
        </div>
        <img id="storyPreview" src="" alt="" style="display:none" class="upload-preview" />
        <div class="form-group">
          <input type="text" id="storyRoadName" placeholder="Road name (optional)" maxlength="80" />
        </div>
        <span class="field-error" id="storyError"></span>
        <button class="btn btn-primary btn-full" id="submitStoryBtn">Post Story</button>
      </div>
    </div>
  </div>

  <!-- ═══ STORY VIEWER — full portrait phone ══════════════════════ -->
  <div class="story-overlay" id="storyOverlay">
    <div class="story-viewer" id="storyViewer">
      <!-- Progress bars row -->
      <div class="story-bars" id="storyBars"></div>
      <!-- User info -->
      <div class="story-user-header" id="storyUserHeader"></div>
      <!-- Close -->
      <button class="story-close" id="storyClose">&times;</button>
      <!-- Full image -->
      <img id="storyViewImg" src="" alt="" />
      <!-- Road name caption -->
      <div class="story-info" id="storyInfo"></div>
      <!-- Tap zones (prev / next) -->
      <button class="story-nav story-prev" id="storyPrev" aria-label="Previous story"></button>
      <button class="story-nav story-next" id="storyNext" aria-label="Next story"></button>
    </div>
  </div>

  <!-- ═══ AUTH MODAL ═══════════════════════════════════════════════ -->
  <div class="modal-overlay" id="authOverlay" role="dialog" aria-modal="true">
    <div class="modal">
      <div class="modal-header">
        <h3 id="authTitle">Sign In</h3>
        <button class="modal-close" id="authClose">&times;</button>
      </div>
      <div class="modal-body">
        <form id="loginForm" novalidate>
          <div class="form-group"><input type="email" id="loginEmail" placeholder="your@email.com" autocomplete="email" /><span class="field-error" id="loginEmailError"></span></div>
          <div class="form-group"><input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password" /><span class="field-error" id="loginPasswordError"></span></div>
          <span class="field-error" id="loginError"></span>
          <button type="submit" class="btn btn-primary btn-full">Sign In</button>
        </form>
        <form id="registerForm" novalidate style="display:none">
          <div class="form-group"><input type="text" id="regName" placeholder="Your name" /><span class="field-error" id="regNameError"></span></div>
          <div class="form-group"><input type="email" id="regEmail" placeholder="your@email.com" /><span class="field-error" id="regEmailError"></span></div>
          <div class="form-group"><input type="password" id="regPassword" placeholder="Password (min 6 chars)" /><span class="field-error" id="regPasswordError"></span></div>
          <span class="field-error" id="regError"></span>
          <button type="submit" class="btn btn-primary btn-full">Create Account</button>
        </form>
        <div class="auth-switch">
          <span id="authSwitchText">Don't have an account?</span>
          <button class="auth-switch-btn" id="authSwitchBtn">Sign Up</button>
        </div>
      </div>
    </div>
  </div>

  <script src="community.js"></script>
</body>
</html>
