<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Culture" />
  <meta name="theme-color" content="#0C0C0F" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <title>Culture</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=DM+Sans:ital,wght@0,400;0,500;0,600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --c-bg: #0C0C0F;
      --c-surface: #141417;
      --c-border: #252529;
      --c-text: #EDEBE6;
      --c-text-2: #5C5A60;
      --c-accent: #E4A530;
      --c-accent-h: #CF9220;
      --font-ui: 'DM Sans', system-ui, -apple-system, sans-serif;
      --font-head: 'Barlow Condensed', system-ui, sans-serif;
      --radius: 12px;
    }

    html, body {
      height: 100%;
      background: var(--c-bg);
      color: var(--c-text);
      font-family: var(--font-ui);
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: env(safe-area-inset-top, 20px) 20px env(safe-area-inset-bottom, 20px);
    }

    .auth-card {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    .auth-brand { text-align: center; }

    .auth-logo {
      font-family: var(--font-head);
      font-size: 52px;
      font-weight: 800;
      letter-spacing: -1px;
      color: var(--c-text);
      line-height: 1;
    }

    .auth-logo span { color: var(--c-accent); }

    .auth-tagline {
      margin-top: 8px;
      font-size: 14px;
      color: var(--c-text-2);
      letter-spacing: 0.3px;
    }

    .auth-box {
      background: var(--c-surface);
      border: 1px solid var(--c-border);
      border-radius: var(--radius);
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .auth-tabs {
      display: flex;
      border-bottom: 1px solid var(--c-border);
      margin-bottom: 4px;
    }

    .auth-tab {
      flex: 1;
      background: none;
      border: none;
      color: var(--c-text-2);
      font-family: var(--font-ui);
      font-size: 14px;
      font-weight: 600;
      padding: 0 0 12px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: color 0.15s, border-color 0.15s;
    }

    .auth-tab.active {
      color: var(--c-text);
      border-bottom-color: var(--c-accent);
    }

    .form-panel { display: flex; flex-direction: column; gap: 14px; }
    .form-panel.hidden { display: none; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }

    input[type="text"],
    input[type="email"],
    input[type="password"] {
      background: var(--c-bg);
      border: 1px solid var(--c-border);
      border-radius: 8px;
      color: var(--c-text);
      font-family: var(--font-ui);
      font-size: 15px;
      padding: 12px 14px;
      outline: none;
      transition: border-color 0.15s;
      width: 100%;
    }

    input:focus { border-color: var(--c-accent); }
    input::placeholder { color: var(--c-text-2); }

    .field-error { font-size: 12px; color: #e05555; min-height: 16px; }

    .btn-primary {
      background: var(--c-accent);
      color: #0C0C0F;
      border: none;
      border-radius: 8px;
      font-family: var(--font-ui);
      font-size: 15px;
      font-weight: 600;
      padding: 13px;
      cursor: pointer;
      width: 100%;
      transition: background 0.15s, transform 0.08s;
    }

    .btn-primary:hover { background: var(--c-accent-h); }
    .btn-primary:active { transform: scale(0.98); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    .global-error {
      font-size: 13px;
      color: #e05555;
      text-align: center;
      min-height: 18px;
    }

    .auth-footer {
      text-align: center;
      font-size: 13px;
      color: var(--c-text-2);
    }

    .auth-divider {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--c-text-2);
      font-size: 12px;
    }

    .auth-divider::before,
    .auth-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--c-border);
    }

    .btn-google {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #fff;
      color: #1f1f1f;
      border: none;
      border-radius: 8px;
      font-family: var(--font-ui);
      font-size: 15px;
      font-weight: 500;
      padding: 12px;
      cursor: pointer;
      width: 100%;
      transition: background 0.15s, transform 0.08s;
    }

    .btn-google:hover { background: #f0f0f0; }
    .btn-google:active { transform: scale(0.98); }
    .btn-google:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-google svg { flex-shrink: 0; }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="auth-brand">
      <div class="auth-logo">ATLA<span>S</span></div>
      <div class="auth-tagline">The driving enthusiast community</div>
    </div>

    <div class="auth-box">
      <!-- Google Sign-In -->
      <button class="btn-google" id="googleBtn">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.08 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-3.59-13.46-8.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/><path fill="none" d="M0 0h48v48H0z"/></svg>
        Continue with Google
      </button>
      <div class="auth-divider">or</div>

      <div class="auth-tabs">
        <button class="auth-tab active" id="tabLogin">Sign In</button>
        <button class="auth-tab" id="tabRegister">Create Account</button>
      </div>

      <!-- Login -->
      <div class="form-panel" id="loginPanel">
        <div class="form-group">
          <input type="email" id="loginEmail" placeholder="Email" autocomplete="email" />
          <span class="field-error" id="loginEmailErr"></span>
        </div>
        <div class="form-group">
          <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password" />
          <span class="field-error" id="loginPassErr"></span>
        </div>
        <span class="global-error" id="loginErr"></span>
        <button class="btn-primary" id="loginBtn" data-label="Sign In">Sign In</button>
      </div>

      <!-- Register -->
      <div class="form-panel hidden" id="registerPanel">
        <div class="form-group">
          <input type="text" id="regName" placeholder="Your name" autocomplete="name" />
          <span class="field-error" id="regNameErr"></span>
        </div>
        <div class="form-group">
          <input type="email" id="regEmail" placeholder="Email" autocomplete="email" />
          <span class="field-error" id="regEmailErr"></span>
        </div>
        <div class="form-group">
          <input type="password" id="regPassword" placeholder="Password (min 6 chars)" autocomplete="new-password" />
          <span class="field-error" id="regPassErr"></span>
        </div>
        <span class="global-error" id="regErr"></span>
        <button class="btn-primary" id="registerBtn" data-label="Create Account">Create Account</button>
      </div>
    </div>

    <div class="auth-footer">By joining, you agree to our community guidelines.</div>
  </div>

  <script>
    if (localStorage.getItem('culture-token')) location.replace('community.html');

    const tabLogin = document.getElementById('tabLogin');
    const tabReg   = document.getElementById('tabRegister');
    const loginPan = document.getElementById('loginPanel');
    const regPan   = document.getElementById('registerPanel');

    tabLogin.addEventListener('click', () => {
      tabLogin.classList.add('active'); tabReg.classList.remove('active');
      loginPan.classList.remove('hidden'); regPan.classList.add('hidden');
    });
    tabReg.addEventListener('click', () => {
      tabReg.classList.add('active'); tabLogin.classList.remove('active');
      regPan.classList.remove('hidden'); loginPan.classList.add('hidden');
    });

    function setLoading(btn, loading) {
      btn.disabled = loading;
      btn.textContent = loading ? 'Please wait…' : btn.dataset.label;
    }

    document.getElementById('loginBtn').addEventListener('click', async () => {
      const email = document.getElementById('loginEmail').value.trim();
      const pass  = document.getElementById('loginPassword').value;
      ['loginEmailErr','loginPassErr','loginErr'].forEach(id => document.getElementById(id).textContent = '');
      if (!email) { document.getElementById('loginEmailErr').textContent = 'Email is required.'; return; }
      if (!pass)  { document.getElementById('loginPassErr').textContent  = 'Password is required.'; return; }
      const btn = document.getElementById('loginBtn');
      setLoading(btn, true);
      try {
        const r = await fetch('/api/auth/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ email, password: pass }) });
        const d = await r.json();
        if (!r.ok) { document.getElementById('loginErr').textContent = d.error || 'Sign in failed.'; return; }
        localStorage.setItem('culture-token', d.token);
        location.replace('community.html');
      } catch { document.getElementById('loginErr').textContent = 'Network error. Try again.'; }
      finally { setLoading(btn, false); }
    });

    document.getElementById('registerBtn').addEventListener('click', async () => {
      const name  = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const pass  = document.getElementById('regPassword').value;
      ['regNameErr','regEmailErr','regPassErr','regErr'].forEach(id => document.getElementById(id).textContent = '');
      if (!name)  { document.getElementById('regNameErr').textContent  = 'Name is required.'; return; }
      if (!email) { document.getElementById('regEmailErr').textContent = 'Email is required.'; return; }
      if (!pass || pass.length < 6) { document.getElementById('regPassErr').textContent = 'At least 6 characters.'; return; }
      const btn = document.getElementById('registerBtn');
      setLoading(btn, true);
      try {
        const r = await fetch('/api/auth/register', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ name, email, password: pass }) });
        const d = await r.json();
        if (!r.ok) { document.getElementById('regErr').textContent = d.error || 'Registration failed.'; return; }
        localStorage.setItem('culture-token', d.token);
        location.replace('community.html');
      } catch { document.getElementById('regErr').textContent = 'Network error. Try again.'; }
      finally { setLoading(btn, false); }
    });

    document.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      if (!loginPan.classList.contains('hidden')) document.getElementById('loginBtn').click();
      else document.getElementById('registerBtn').click();
    });

    // ── Google Sign-In ──────────────────────────────────────────
    async function handleGoogleCredential(credential) {
      const btn = document.getElementById('googleBtn');
      btn.disabled = true;
      btn.textContent = 'Signing in…';
      try {
        const r = await fetch('/api/auth/google', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ credential }),
        });
        const d = await r.json();
        if (!r.ok) {
          btn.disabled = false;
          btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.08 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-3.59-13.46-8.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/><path fill="none" d="M0 0h48v48H0z"/></svg> Continue with Google`;
          document.getElementById('loginErr').textContent = d.error || 'Google sign-in failed.';
          return;
        }
        localStorage.setItem('culture-token', d.token);
        location.replace('community.html');
      } catch {
        btn.disabled = false;
        btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.08 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-3.59-13.46-8.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/><path fill="none" d="M0 0h48v48H0z"/></svg> Continue with Google`;
        document.getElementById('loginErr').textContent = 'Network error. Try again.';
      }
    }

    // Click opens Google One Tap / popup via GIS
    document.getElementById('googleBtn').addEventListener('click', () => {
      if (typeof google === 'undefined' || !google.accounts) {
        document.getElementById('loginErr').textContent = 'Google sign-in not available. Check your connection.';
        return;
      }
      google.accounts.id.prompt();
    });

    // GIS callback (credential from One Tap or button)
    window.__googleCallback = (response) => {
      handleGoogleCredential(response.credential);
    };
  </script>
  <!-- Google Identity Services — loaded after page script so __googleCallback is defined first -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <div id="g_id_onload"
       data-client_id=""
       data-callback="__googleCallback"
       data-auto_prompt="false"
       style="display:none"></div>
  <script>
    // Set client_id from meta tag (injected by server or env) or window global
    // Falls back to a placeholder so the GIS script doesn't error
    fetch('/api/auth/google-client-id').then(r => r.json()).then(d => {
      const el = document.getElementById('g_id_onload');
      if (d.clientId) el.setAttribute('data-client_id', d.clientId);
    }).catch(() => {});
  </script>
  <script>if ("serviceWorker" in navigator) { window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js")); }</script>
</body>
</html>
